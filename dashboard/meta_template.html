<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__CLIENT__ Ad Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#F2F3F6;--surface:#FFFFFF;--sunk:#E9EBF0;--ink:#161B26;--muted:#5A6273;--faint:#8A91A0;--line:#DCE0E7;
  --accent:#1B5FD1;--accent-soft:#E1EBFB;--on-accent:#FFFFFF;
  --win:#137333;--win-bg:#E3F2E7;--avg:#B45F06;--avg-bg:#FCEFDF;--lose:#C5221F;--lose-bg:#FBE7E6;--early:#5A6273;--early-bg:#ECEEF2;
  --f1:#1B5FD1;--f2:#2E7DE0;--f3:#5C9BEA;--f4:#8DBAF0;--f5:#BBD5F6;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --ui:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --ground:#0E1117;--surface:#161A22;--sunk:#1D222C;--ink:#E7EAF0;--muted:#A0A8B7;--faint:#6F7788;--line:#29303C;
  --accent:#6AA4FF;--accent-soft:#16294A;--on-accent:#0E1117;
  --win:#6DD58C;--win-bg:#15321F;--avg:#F2B061;--avg-bg:#3A2A14;--lose:#F28B82;--lose-bg:#3C1C1A;--early:#A0A8B7;--early-bg:#232833;
  --f1:#6AA4FF;--f2:#5590EE;--f3:#4379D0;--f4:#3563AB;--f5:#2B4E86;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0E1117;--surface:#161A22;--sunk:#1D222C;--ink:#E7EAF0;--muted:#A0A8B7;--faint:#6F7788;--line:#29303C;
  --accent:#6AA4FF;--accent-soft:#16294A;--on-accent:#0E1117;
  --win:#6DD58C;--win-bg:#15321F;--avg:#F2B061;--avg-bg:#3A2A14;--lose:#F28B82;--lose-bg:#3C1C1A;--early:#A0A8B7;--early-bg:#232833;
  --f1:#6AA4FF;--f2:#5590EE;--f3:#4379D0;--f4:#3563AB;--f5:#2B4E86;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:14px/1.45 var(--ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em}
.wrap{max-width:1320px;margin:0 auto;padding:18px 16px 60px}
header.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
h1{font-size:26px;font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px;color:var(--muted)}
.meta b{color:var(--ink)}
.badge-sample{background:var(--lose-bg);color:var(--lose);font-weight:700;padding:2px 8px;border-radius:6px;font-size:12px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:6px 0 16px;flex-wrap:wrap}
.tab{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{padding:12px 14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font:700 24px var(--display);margin-top:2px}
.kpi .s{font-size:12px;color:var(--faint)}
.two{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
@media(max-width:480px){.two{grid-template-columns:1fr}}
.sec{margin-top:22px}
.sec>h2{font-size:18px;margin-bottom:4px}
.sec>p.sub{margin:0 0 10px;color:var(--muted);font-size:13px;max-width:80ch}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.v-win{background:var(--win-bg);color:var(--win)}.v-lose{background:var(--lose-bg);color:var(--lose)}
.v-avg{background:var(--avg-bg);color:var(--avg)}.v-early{background:var(--early-bg);color:var(--early)}
.fmt{background:var(--sunk);color:var(--muted);font-weight:600}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--surface);cursor:pointer;user-select:none}
th.sorted::after{content:" ▾";color:var(--accent)}
.tscroll{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
td.name{white-space:normal;min-width:220px;max-width:340px}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--sunk);flex:none}
.thumb.ph{display:grid;place-items:center;color:var(--faint);font-size:11px}
.row{display:flex;gap:10px;align-items:center}
.small{font-size:12px;color:var(--muted)}
.mono{font-family:var(--mono)}
.cell-bar{position:relative;min-width:68px}
.cell-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent-soft);z-index:0;border-radius:0 4px 4px 0}
.cell-bar span{position:relative;z-index:1}
.funnel{display:grid;gap:5px}
.frow{display:grid;grid-template-columns:88px 1fr 76px;gap:8px;align-items:center;font-size:12px}
.frow .bar{height:14px;background:var(--sunk);border-radius:4px;overflow:hidden}
.frow .bar i{display:block;height:100%;border-radius:4px}
.frow b{text-align:right;font-family:var(--mono);font-weight:500}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 12px}
select,input[type=search]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:6px 12px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.cards{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.cc{padding:0;overflow:hidden;cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;display:flex;flex-direction:column}
.cc:hover{border-color:var(--accent)}
.cc .im{aspect-ratio:1/1;background:var(--sunk);position:relative;display:grid;place-items:center;color:var(--faint)}
.cc .im img{width:100%;height:100%;object-fit:cover;display:block}
.cc .im .chip{position:absolute;left:8px;top:8px}
.cc .im .play{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;border-radius:99px;padding:1px 8px;font-size:11px}
.cc .bd{padding:10px 12px;display:grid;gap:6px}
.cc .t{font-weight:600;font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;font-size:11px;color:var(--muted)}
.mini b{display:block;color:var(--ink);font-size:13px}
.split{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:16px;align-items:start}
@media(max-width:900px){.split{grid-template-columns:1fr}}
.list{display:grid;gap:6px;max-height:78vh;overflow:auto;padding-right:2px}
.li{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.li[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.li .tx{min-width:0;flex:1}
.li .tx b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.fb{max-width:480px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;color:var(--ink)}
.fb .h{display:flex;gap:10px;align-items:center;padding:10px 12px}
.fb .av{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700}
.fb .pt{padding:0 12px 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.fb .md{background:var(--sunk);aspect-ratio:1/1;display:grid;place-items:center;color:var(--faint);position:relative}
.fb .md img{width:100%;height:100%;object-fit:cover;display:block}
.fb .ct{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--sunk)}
.fb .ct .u{font-size:11px;color:var(--muted);text-transform:uppercase}
.fb .ct b{display:block;font-size:14px}
.fb .btn{background:var(--line);color:var(--ink);border-radius:6px;padding:7px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.mgrid div{background:var(--sunk);border-radius:8px;padding:8px 10px}
.mgrid span{font-size:11px;color:var(--muted);display:block}
.mgrid b{font:700 16px var(--display)}
a{color:var(--accent);font-weight:600;text-decoration:none}a:hover{text-decoration:underline}
.cform{display:grid;gap:8px;margin:8px 0}
.cform input,.cform textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.cbtn{background:var(--accent);color:var(--on-accent);border:0;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer}
.cbtn:disabled{opacity:.5}
.clist{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:8px}
.clist li{background:var(--sunk);border-radius:8px;padding:8px 10px}
.clist .chead{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.clist p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.sr{position:absolute;left:-9999px}
.empty{color:var(--muted);padding:18px;text-align:center}
svg text{font:11px var(--ui);fill:var(--muted)}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1><span id="client">__CLIENT__</span> Ad Dashboard</h1>
      <div class="meta" id="meta"></div>
    </div>
    <button class="seg" id="theme" type="button" style="padding:6px 12px;cursor:pointer;background:var(--surface);color:var(--muted);font-weight:600" aria-label="Switch light or dark theme">Theme</button>
  </header>
  <div class="tabs" role="tablist" id="tabs"></div>
  <main id="main"></main>
</div>

<script>
const DATA=/*__DATA__*/null;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get(k,d){try{const v=localStorage.getItem("meta."+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("meta."+k,JSON.stringify(v))}catch(e){}}};
const CUR=(DATA.account&&DATA.account.currency)||"USD";
const ads=DATA.ads;
const state={tab:store.get("tab","creative"),sort:store.get("sort","spend"),fmt:"All",camp:"All",status:"Active",q:"",sel:null,view:store.get("view","cards"),hookSort:"spend"};

/* ------------------------------------------------------------------ numbers */
const money=(v,d)=>{try{return new Intl.NumberFormat("en-US",{style:"currency",currency:CUR,maximumFractionDigits:d==null?(Math.abs(v)>=100?0:2):d}).format(v)}catch(e){return (v||0).toFixed(2)}};
const num=v=>Math.round(v||0).toLocaleString("en-US");
const pct=(v,d=1)=>v==null||!isFinite(v)?"–":(v*100).toFixed(d)+"%";
const div=(a,b)=>b>0?a/b:null;
const dash=v=>v==null?"–":v;
const FIELDS=["spend","impr","reach","clicks","linkClicks","results","value","plays3s","p25","p50","p75","p95","p100","thruplay","s30","addToCart"];
function agg(list){
  const t={};FIELDS.forEach(f=>t[f]=0);let w=0,aw=0;
  list.forEach(a=>{FIELDS.forEach(f=>t[f]+=a.m[f]||0);if(a.m.plays3s){aw+=a.m.avgWatch*a.m.plays3s;w+=a.m.plays3s}});
  t.avgWatch=w?aw/w:0;return t;
}
function rates(m){
  return {ctr:div(m.linkClicks||m.clicks,m.impr),cpc:div(m.spend,m.linkClicks||m.clicks),cpm:m.impr?m.spend/m.impr*1000:null,
    cpa:div(m.spend,m.results),roas:div(m.value,m.spend),hook:div(m.plays3s,m.impr),
    hold:div(m.thruplay,m.plays3s),r25:div(m.p25,m.plays3s),r50:div(m.p50,m.plays3s),r75:div(m.p75,m.plays3s),r95:div(m.p95,m.plays3s),r100:div(m.p100,m.plays3s)};
}
const ALL=agg(ads),BASE=rates(ALL);
const VIDEO_ADS=ads.filter(a=>a.format==="Video");
const VBASE=rates(agg(VIDEO_ADS));
const hasResults=ALL.results>0,hasValue=ALL.value>0;
const T=DATA.targets||{};
const MIN_SPEND=Math.max(10,ALL.spend*0.015),MIN_IMPR=1000;

/* Verdict: is this creative (or group of creatives) pulling its weight against the account's own average, or a target set in clients.json. */
function verdict(m,isVideo){
  const r=rates(m),why=[];
  if(m.impr<MIN_IMPR||m.spend<MIN_SPEND)return{k:"early",label:"Too early",why:["Not enough spend or impressions yet ("+money(m.spend)+", "+num(m.impr)+" impr.)"]};
  let score=0;
  const cpaBase=T.cpa||BASE.cpa,roasBase=T.roas||BASE.roas;
  if(hasResults){
    if(m.results===0){score=-2;why.push(money(m.spend)+" spent, no results")}
    else if(T.roas&&r.roas!=null||(hasValue&&!T.cpa&&r.roas!=null)){
      const q=r.roas/roasBase;score=q>=1.15?1:q<=.85?-1:0;why.push("ROAS "+r.roas.toFixed(2)+" vs "+roasBase.toFixed(2)+(T.roas?" target":" account avg"));
    }else{
      const q=r.cpa/cpaBase;score=q<=.85?1:q>=1.2?-1:0;why.push("CPA "+money(r.cpa)+" vs "+money(cpaBase)+(T.cpa?" target":" account avg"));
    }
  }else if(BASE.ctr){
    const q=r.ctr/BASE.ctr;score=q>=1.15?1:q<=.85?-1:0;why.push("CTR "+pct(r.ctr,2)+" vs "+pct(BASE.ctr,2)+" account avg");
  }
  if(isVideo&&r.hook!=null&&VBASE.hook){
    const t=T.hookRate||VBASE.hook,q=r.hook/t;
    why.push("Hook rate "+pct(r.hook)+" vs "+pct(t)+(T.hookRate?" target":" video avg"));
    if(score===0)score=q>=1.2?0.5:q<=.75?-0.5:0;
    if(r.hold!=null&&VBASE.hold&&r.hold<VBASE.hold*.7)why.push("Viewers drop off early (ThruPlay "+pct(r.hold)+" of 3s plays)");
  }
  const k=score>=1?"win":score<=-1?"lose":score>0?"win":score<0?"lose":"avg";
  return{k,label:{win:"Working",lose:"Not working",avg:"Average",early:"Too early"}[k],why,score};
}
ads.forEach(a=>{a.r=rates(a.m);a.v=verdict(a.m,a.format==="Video")});
const chip=v=>`<span class="chip v-${v.k}" title="${esc(v.why.join(" · "))}">${v.label}</span>`;

/* ------------------------------------------------------------------ header */
function renderHeader(){
  const acc=DATA.account||{};
  $("#meta").innerHTML=[DATA.sample?'<span class="badge-sample">SAMPLE DATA, not real results</span>':"",
    `<span>Account <b>${esc(acc.name||acc.id||"")}</b></span>`,`<span>Range <b>${esc(DATA.dateRange)}</b></span>`,
    `<span>${ads.length} ads, ${VIDEO_ADS.length} video</span>`,`<span>Pulled ${esc(DATA.pulledAt.replace("T"," ").slice(0,16))}</span>`].filter(Boolean).join("");
  const tabs=[["creative","Creative insights"],["ads","Ad previews"],["campaigns","Campaigns"]];
  $("#tabs").innerHTML=tabs.map(([k,l])=>`<button class="tab" role="tab" data-tab="${k}" aria-selected="${state.tab===k}">${l}</button>`).join("");
}
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(!b)return;state.tab=b.dataset.tab;store.set("tab",state.tab);render()});
$("#theme").addEventListener("click",()=>{const d=document.documentElement,cur=d.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");d.dataset.theme=cur==="dark"?"light":"dark";store.set("theme",d.dataset.theme)});
const savedTheme=store.get("theme",null);if(savedTheme)document.documentElement.dataset.theme=savedTheme;

/* ------------------------------------------------------------------ shared pieces */
function thumbHtml(a,cls="thumb"){return a.thumb?`<img class="${cls}" src="${esc(a.thumb)}" alt="" loading="lazy">`:`<div class="${cls} ph">${a.format==="Video"?"▶":"IMG"}</div>`}
function hookOf(a){const t=(a.body||"").trim();if(!t)return a.title||"(no text)";const m=t.split(/\n|(?<=[.!?])\s/)[0].replace(/\s+/g," ").trim();return m.length>120?m.slice(0,119)+"…":m}
function kpi(l,v,s){return `<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s||""}</div></div>`}
function funnel(m,compact){
  const r=rates(m);if(!m.plays3s)return `<div class="small">No video plays recorded.</div>`;
  const rows=[["Impressions",1,num(m.impr),"var(--f5)"],["3s plays",m.plays3s/m.impr,pct(r.hook)+" of impr.","var(--f1)"],
    ["25% watched",r.r25*m.plays3s/m.impr,pct(r.r25)+" of 3s","var(--f2)"],["50% watched",r.r50*m.plays3s/m.impr,pct(r.r50)+" of 3s","var(--f3)"],
    ["75% watched",r.r75*m.plays3s/m.impr,pct(r.r75)+" of 3s","var(--f4)"],["95% watched",r.r95*m.plays3s/m.impr,pct(r.r95)+" of 3s","var(--f5)"],
    ["ThruPlay",r.hold*m.plays3s/m.impr,pct(r.hold)+" of 3s","var(--f3)"]];
  const max=Math.max(...rows.map(x=>x[1]),.0001);
  return `<div class="funnel">${rows.slice(0,compact?4:7).map(([l,w,t,c])=>`<div class="frow"><span>${l}</span><div class="bar"><i style="width:${Math.max(2,w/max*100)}%;background:${c}"></i></div><b>${t}</b></div>`).join("")}</div>`;
}
function barCell(v,max,txt){return `<td class="cell-bar"><i style="width:${max?Math.min(100,(v||0)/max*100):0}%"></i><span>${txt}</span></td>`}
function sortTable(rows,key,desc=true){return rows.slice().sort((a,b)=>{const x=key(a),y=key(b);return(y==null?-Infinity:y)-(x==null?-Infinity:x)})}

/* ------------------------------------------------------------------ creative insights */
const SORTS={spend:["Spend",a=>a.m.spend],roas:["ROAS",a=>a.r.roas],cpa:["Lowest CPA",a=>a.r.cpa==null?null:-a.r.cpa],ctr:["CTR",a=>a.r.ctr],hook:["Hook rate (3s)",a=>a.r.hook],hold:["ThruPlay rate",a=>a.r.hold],r50:["50% watched",a=>a.r.r50]};
function renderCreative(){
  const A=ALL,B=BASE,V=VBASE;
  const working=ads.filter(a=>a.v.k==="win").sort((x,y)=>y.m.spend-x.m.spend),losing=ads.filter(a=>a.v.k==="lose").sort((x,y)=>y.m.spend-x.m.spend);
  const fmts=[...new Set(ads.map(a=>a.format))].map(f=>({f,list:ads.filter(a=>a.format===f)})).map(g=>({...g,m:agg(g.list)})).sort((a,b)=>b.m.spend-a.m.spend);
  const hooks=new Map();ads.forEach(a=>{const h=hookOf(a);if(!hooks.has(h))hooks.set(h,[]);hooks.get(h).push(a)});
  const hookRows=[...hooks].map(([h,list])=>{const m=agg(list);return{h,list,m,r:rates(m),v:verdict(m,list.every(a=>a.format==="Video")),video:list.some(a=>a.format==="Video")}});
  const hs={spend:x=>x.m.spend,hook:x=>x.video?x.r.hook:null,ctr:x=>x.r.ctr,cpa:x=>x.r.cpa==null?null:-x.r.cpa,roas:x=>x.r.roas};
  const hr=sortTable(hookRows,hs[state.hookSort]||hs.spend).slice(0,25);
  const vids=sortTable(VIDEO_ADS.filter(a=>a.m.plays3s>0),(SORTS[state.sort]||SORTS.spend)[1]);
  const maxHook=Math.max(...vids.map(a=>a.r.hook||0),.01);
  const main=$("#main");
  main.innerHTML=`
  <div class="grid kpis">
    ${kpi("Spend",money(A.spend),num(A.impr)+" impressions")}
    ${kpi(hasValue?"ROAS":"CPA",hasValue?(B.roas==null?"–":B.roas.toFixed(2)):dash(B.cpa==null?null:money(B.cpa)),hasResults?num(A.results)+" results"+(hasValue?" · CPA "+(B.cpa==null?"–":money(B.cpa)):""):"no results tracked")}
    ${kpi("CTR (link)",pct(B.ctr,2),"CPC "+(B.cpc==null?"–":money(B.cpc)))}
    ${kpi("Hook rate",pct(V.hook),"3-second plays ÷ impressions (video)")}
    ${kpi("ThruPlay rate",pct(V.hold),"ThruPlays ÷ 3-second plays")}
    ${kpi("Avg watch time",agg(VIDEO_ADS).avgWatch?agg(VIDEO_ADS).avgWatch.toFixed(1)+"s":"–","weighted by 3s plays")}
  </div>

  <section class="sec"><h2>What's working and what's not</h2>
    <p class="sub">Each creative is judged on its own results against the account average${T.cpa||T.roas||T.hookRate?" (or the targets set for this client)":""}: ${hasResults?(hasValue?"ROAS":"CPA"):"CTR"} first, then hook rate for video. Creatives without enough spend are marked "Too early" instead of being judged.</p>
    <div class="grid two">
      <div class="card"><h3 style="color:var(--win)">Working <span class="small">(${working.length})</span></h3>${creativeList(working.slice(0,6))}</div>
      <div class="card"><h3 style="color:var(--lose)">Not working <span class="small">(${losing.length})</span></h3>${creativeList(losing.slice(0,6))}</div>
    </div>
  </section>

  <section class="sec"><h2>Video retention: who watched how much</h2>
    <p class="sub">Hook rate is the share of impressions that played at least 3 seconds. The percentages after it are the share of those 3-second plays that kept watching to 25 / 50 / 75 / 95 % of the video. A strong hook with a steep drop-off means the opening works but the body doesn't.</p>
    <div class="ctrl"><label class="small" for="sortSel">Sort by</label>
      <select id="sortSel">${Object.entries(SORTS).map(([k,[l]])=>`<option value="${k}" ${state.sort===k?"selected":""}>${l}</option>`).join("")}</select></div>
    ${vids.length?`<div class="tscroll"><table><thead><tr><th>Video ad</th><th>Verdict</th><th>Length</th><th>Spend</th><th>Hook rate</th><th>25%</th><th>50%</th><th>75%</th><th>95%</th><th>ThruPlay</th><th>Avg watch</th><th>CTR</th><th>${hasValue?"ROAS":"CPA"}</th></tr></thead><tbody>
      ${vids.map(a=>`<tr data-open="${esc(a.id)}" style="cursor:pointer"><td class="name"><div class="row">${thumbHtml(a)}<div><b>${esc(a.name)}</b><div class="small">${esc(hookOf(a))}</div></div></div></td><td>${chip(a.v)}</td><td>${a.videoLength?a.videoLength+"s":"–"}</td><td>${money(a.m.spend)}</td>${barCell(a.r.hook,maxHook,pct(a.r.hook))}<td>${pct(a.r.r25,0)}</td><td>${pct(a.r.r50,0)}</td><td>${pct(a.r.r75,0)}</td><td>${pct(a.r.r95,0)}</td><td>${pct(a.r.hold,0)}</td><td>${a.m.avgWatch?a.m.avgWatch.toFixed(1)+"s":"–"}</td><td>${pct(a.r.ctr,2)}</td><td>${hasValue?(a.r.roas==null?"–":a.r.roas.toFixed(2)):(a.r.cpa==null?"–":money(a.r.cpa))}</td></tr>`).join("")}
      <tr style="font-weight:700"><td>All video (weighted)</td><td></td><td></td><td>${money(agg(VIDEO_ADS).spend)}</td><td>${pct(V.hook)}</td><td>${pct(V.r25,0)}</td><td>${pct(V.r50,0)}</td><td>${pct(V.r75,0)}</td><td>${pct(V.r95,0)}</td><td>${pct(V.hold,0)}</td><td></td><td>${pct(V.ctr,2)}</td><td>${hasValue?(V.roas==null?"–":V.roas.toFixed(2)):(V.cpa==null?"–":money(V.cpa))}</td></tr>
      </tbody></table></div>`:`<div class="card empty">No video ads with plays in this range.</div>`}
  </section>

  <section class="sec"><h2>Hooks: the opening line of each ad</h2>
    <p class="sub">Ads are grouped by the first sentence of their primary text (or the headline when there is no text), so the same hook used across several creatives adds up. Hook rate only counts video.</p>
    <div class="ctrl"><label class="small" for="hookSel">Sort by</label>
      <select id="hookSel">${[["spend","Spend"],["hook","Hook rate"],["ctr","CTR"],["cpa","Lowest CPA"],["roas","ROAS"]].map(([k,l])=>`<option value="${k}" ${state.hookSort===k?"selected":""}>${l}</option>`).join("")}</select></div>
    <div class="tscroll"><table><thead><tr><th>Hook</th><th>Verdict</th><th>Ads</th><th>Spend</th><th>Hook rate</th><th>CTR</th><th>Results</th><th>CPA</th><th>ROAS</th></tr></thead><tbody>
      ${hr.map(x=>`<tr><td class="name">${esc(x.h)}</td><td>${chip(x.v)}</td><td>${x.list.length}</td><td>${money(x.m.spend)}</td><td>${x.video?pct(x.r.hook):"–"}</td><td>${pct(x.r.ctr,2)}</td><td>${num(x.m.results)}</td><td>${x.r.cpa==null?"–":money(x.r.cpa)}</td><td>${x.r.roas==null?"–":x.r.roas.toFixed(2)}</td></tr>`).join("")}
    </tbody></table></div>
  </section>

  <section class="sec"><h2>Format comparison</h2>
    <div class="tscroll"><table><thead><tr><th>Format</th><th>Ads</th><th>Spend</th><th>Share</th><th>CTR</th><th>CPC</th><th>Results</th><th>CPA</th><th>ROAS</th></tr></thead><tbody>
      ${fmts.map(g=>{const r=rates(g.m);return `<tr><td>${esc(g.f)}</td><td>${g.list.length}</td><td>${money(g.m.spend)}</td><td>${pct(div(g.m.spend,A.spend),0)}</td><td>${pct(r.ctr,2)}</td><td>${r.cpc==null?"–":money(r.cpc)}</td><td>${num(g.m.results)}</td><td>${r.cpa==null?"–":money(r.cpa)}</td><td>${r.roas==null?"–":r.roas.toFixed(2)}</td></tr>`}).join("")}
    </tbody></table></div>
  </section>

  <section class="sec"><h2>All creatives</h2>
    <div class="ctrl"><div class="seg" id="vseg">${[["All",null],["Working","win"],["Not working","lose"],["Average","avg"],["Too early","early"]].map(([l,k])=>`<button type="button" data-vf="${k||""}" aria-pressed="${(state.vf||"")===(k||"")}">${l}</button>`).join("")}</div></div>
    <div class="grid cards">${sortTable(ads.filter(a=>!state.vf||a.v.k===state.vf),a=>a.m.spend).map(card).join("")||'<div class="empty">Nothing here.</div>'}</div>
  </section>`;
  const ss=$("#sortSel");ss.onchange=()=>{state.sort=ss.value;store.set("sort",state.sort);renderCreative()};
  const hs2=$("#hookSel");hs2.onchange=()=>{state.hookSort=hs2.value;renderCreative()};
  $("#vseg").onclick=e=>{const b=e.target.closest("[data-vf]");if(!b)return;state.vf=b.dataset.vf;renderCreative()};
}
function creativeList(list){
  if(!list.length)return `<div class="small" style="padding:10px 0">None yet.</div>`;
  return list.map(a=>`<div class="li" style="margin-top:8px" data-open="${esc(a.id)}"><div>${thumbHtml(a)}</div><div class="tx"><b>${esc(a.name)}</b><span class="small">${esc(a.v.why[0]||"")}</span><div class="small">${money(a.m.spend)} spent · ${a.format}${a.r.hook!=null&&a.format==="Video"?" · hook "+pct(a.r.hook,0):""}</div></div>${chip(a.v)}</div>`).join("");
}
function card(a){
  const r=a.r;
  return `<button class="cc" data-open="${esc(a.id)}" type="button"><div class="im">${a.thumb?`<img src="${esc(a.thumb)}" alt="" loading="lazy">`:`<span>${a.format==="Video"?"▶ no thumbnail":"no image"}</span>`}<span class="chip v-${a.v.k}">${a.v.label}</span>${a.format==="Video"&&a.videoLength?`<span class="play">▶ ${a.videoLength}s</span>`:""}</div>
    <div class="bd"><div class="t">${esc(hookOf(a))}</div>
    <div class="mini"><span><b>${money(a.m.spend)}</b>spend</span><span><b>${hasValue?(r.roas==null?"–":r.roas.toFixed(2)):(r.cpa==null?"–":money(r.cpa))}</b>${hasValue?"ROAS":"CPA"}</span><span><b>${a.format==="Video"?pct(r.hook,0):pct(r.ctr,1)}</b>${a.format==="Video"?"hook":"CTR"}</span></div></div></button>`;
}

/* ------------------------------------------------------------------ ads (previews) */
function filtered(){
  const q=state.q.toLowerCase();
  return ads.filter(a=>(state.camp==="All"||a.campaign===state.camp)&&(state.fmt==="All"||a.format===state.fmt)
    &&(state.status==="All"||(state.status==="Active"?a.status==="ACTIVE":a.status!=="ACTIVE"))
    &&(!q||(a.name+" "+a.body+" "+a.title+" "+a.campaign+" "+a.adset).toLowerCase().includes(q)));
}
function renderAds(){
  const camps=[...new Set(ads.map(a=>a.campaign))].sort(),fmts=[...new Set(ads.map(a=>a.format))].sort();
  const list=sortTable(filtered(),a=>a.m.spend);
  if(!state.sel||!ads.some(a=>a.id===state.sel))state.sel=list[0]&&list[0].id;
  $("#main").innerHTML=`<div class="ctrl">
    <input type="search" id="q" placeholder="Search ads, copy, campaigns" value="${esc(state.q)}" style="min-width:220px">
    <select id="fc"><option>All</option>${camps.map(c=>`<option ${state.camp===c?"selected":""}>${esc(c)}</option>`).join("")}</select>
    <select id="ff"><option>All</option>${fmts.map(c=>`<option ${state.fmt===c?"selected":""}>${esc(c)}</option>`).join("")}</select>
    <select id="fs">${["Active","Not active","All"].map(c=>`<option ${state.status===c?"selected":""}>${c}</option>`).join("")}</select>
    <span class="small">${list.length} ads</span></div>
    <div class="split"><div class="list" id="alist">${list.map(a=>`<button class="li" data-open="${esc(a.id)}" aria-current="${a.id===state.sel}" type="button">${thumbHtml(a)}<div class="tx"><b>${esc(a.name)}</b><span class="small">${esc(a.campaign)} · ${esc(a.adset)}</span></div>${chip(a.v)}</button>`).join("")||'<div class="empty">No ads match.</div>'}</div>
    <div id="detail"></div></div>`;
  $("#q").oninput=e=>{state.q=e.target.value;const pos=e.target.selectionStart;renderAds();const q=$("#q");q.focus();q.setSelectionRange(pos,pos)};
  $("#fc").onchange=e=>{state.camp=e.target.value;renderAds()};$("#ff").onchange=e=>{state.fmt=e.target.value;renderAds()};$("#fs").onchange=e=>{state.status=e.target.value;renderAds()};
  renderDetail();
}
const CTAS={SHOP_NOW:"Shop now",LEARN_MORE:"Learn more",SIGN_UP:"Sign up",BUY_NOW:"Buy now",ORDER_NOW:"Order now",GET_OFFER:"Get offer",SUBSCRIBE:"Subscribe",CONTACT_US:"Contact us",BOOK_TRAVEL:"Book now",NO_BUTTON:""};
const cta=c=>c in CTAS?CTAS[c]:String(c||"").toLowerCase().replace(/_/g," ").replace(/^./,x=>x.toUpperCase());
function renderDetail(){
  const a=ads.find(x=>x.id===state.sel),el=$("#detail");
  if(!a){el.innerHTML=`<div class="card empty">Pick an ad.</div>`;return}
  const r=a.r,host=(a.url||DATA.domain||"").replace(/^https?:\/\//,"").split("/")[0];
  const page=(DATA.account&&DATA.account.name)||DATA.client;
  const bodies=(a.variants&&a.variants.bodies||[]).filter(b=>b&&b!==a.body),titles=(a.variants&&a.variants.titles||[]).filter(b=>b&&b!==a.title);
  el.innerHTML=`<div class="grid" style="gap:14px">
    <div class="card"><div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:8px"><div><h3>${esc(a.name)}</h3><div class="small">${esc(a.campaign)} › ${esc(a.adset)} · ${esc(a.status.toLowerCase().replace(/_/g," "))}</div></div>${chip(a.v)}</div>
      <p class="small" style="margin:8px 0 0">${a.v.why.map(esc).join(" · ")}</p></div>
    <div class="grid two" style="gap:14px;align-items:start">
      <div class="fb"><div class="h"><div class="av">${esc((page||"?")[0])}</div><div><b>${esc(page)}</b><div class="small">Sponsored</div></div></div>
        <div class="pt">${esc(a.body||"")}</div>
        <div class="md">${a.thumb?`<img src="${esc(a.thumb)}" alt="">`:`<span>${a.format==="Video"?"▶ video (no thumbnail)":"no image"}</span>`}</div>
        <div class="ct"><div style="min-width:0"><span class="u">${esc(host)}</span><b>${esc(a.title||"")}</b><span class="small">${esc(a.description||"")}</span></div>${cta(a.cta)?`<span class="btn">${esc(cta(a.cta))}</span>`:""}</div></div>
      <div class="grid" style="gap:12px">
        <div class="card"><h3 style="margin-bottom:8px">Performance <span class="small">${esc(DATA.dateRange)}</span></h3><div class="mgrid">
          <div><span>Spend</span><b>${money(a.m.spend)}</b></div><div><span>Impressions</span><b>${num(a.m.impr)}</b></div>
          <div><span>CTR (link)</span><b>${pct(r.ctr,2)}</b></div><div><span>CPC</span><b>${r.cpc==null?"–":money(r.cpc)}</b></div>
          <div><span>Results</span><b>${num(a.m.results)}</b></div><div><span>CPA</span><b>${r.cpa==null?"–":money(r.cpa)}</b></div>
          <div><span>ROAS</span><b>${r.roas==null?"–":r.roas.toFixed(2)}</b></div><div><span>CPM</span><b>${r.cpm==null?"–":money(r.cpm)}</b></div></div></div>
        ${a.format==="Video"?`<div class="card"><h3 style="margin-bottom:8px">Video retention${a.videoLength?` <span class="small">${a.videoLength}s video</span>`:""}</h3>${funnel(a.m)}</div>`:""}
        <div class="card small">${[a.previewLink?`<a href="${esc(a.previewLink)}" target="_blank" rel="noopener">Open Meta preview</a>`:"",a.permalink?`<a href="${esc(a.permalink)}" target="_blank" rel="noopener">View post</a>`:"",a.url?`<a href="${esc(a.url)}" target="_blank" rel="noopener">Landing page</a>`:""].filter(Boolean).join(" · ")||"No preview links for this ad."}
          ${bodies.length||titles.length?`<div style="margin-top:8px"><b>Other tested copy</b>${bodies.concat(titles).slice(0,8).map(t=>`<div>${esc(t)}</div>`).join("")}</div>`:""}</div>
      </div></div>
    <section class="card" id="cbox" hidden></section></div>`;
  loadComments(a);
}
$("#main").addEventListener("click",e=>{
  const o=e.target.closest("[data-open]");if(!o)return;
  state.sel=o.dataset.open;state.tab="ads";store.set("tab","ads");try{history.replaceState(null,"","#ad-"+state.sel)}catch(x){}render();window.scrollTo({top:0});
});

/* ------------------------------------------------------------------ comments (same endpoints as the Google dashboards) */
const cm={on:null,byAd:{},draft:{}};
const CAPI=["api/notes","api/comments"];
const whenText=iso=>{const d=new Date(iso);return isNaN(d)?iso:d.toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})};
function commentInner(ad,list){
  return `<h3>Comments <span class="small">${list.length}</span></h3>
    <form class="cform" data-ad="${esc(ad.id)}"><label class="sr" for="cName">Your name</label><input id="cName" name="name" maxlength="80" placeholder="Your name" value="${esc(store.get("commentName",""))}">
    <label class="sr" for="cText">Comment</label><textarea id="cText" name="text" maxlength="2000" rows="3" placeholder="Add a comment on this creative">${esc(cm.draft[ad.id]||"")}</textarea>
    <div class="row"><button type="submit" class="cbtn">Add comment</button><span class="cstat small" role="status"></span></div></form>
    ${list.length?`<ul class="clist">${list.map(c=>`<li><div class="chead"><b>${esc(c.name)}</b><span>${esc(whenText(c.at))}</span></div><p>${esc(c.text)}</p></li>`).join("")}</ul>`:`<p class="small">No comments yet.</p>`}`;
}
function fillComments(ad){const b=$("#cbox");if(!b||state.sel!==ad.id)return;b.innerHTML=commentInner(ad,cm.byAd[ad.id]);b.hidden=false}
function loadComments(ad,attempt=0){
  if(cm.on===false)return;if(cm.byAd[ad.id]){fillComments(ad);return}
  fetch(CAPI[attempt%2]+"?ad="+encodeURIComponent(ad.id),{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject(r.status))
    .then(j=>{cm.on=true;cm.byAd[ad.id]=j.comments||[];fillComments(ad)})
    .catch(why=>{if(why===404&&attempt>=1){cm.on=false;return}if(attempt<3)setTimeout(()=>loadComments(ad,attempt+1),600*(attempt+1))});
}
$("#main").addEventListener("input",e=>{const f=e.target.closest(".cform");if(!f)return;if(e.target.name==="text")cm.draft[f.dataset.ad]=e.target.value;if(e.target.name==="name")store.set("commentName",e.target.value)});
$("#main").addEventListener("submit",e=>{
  const f=e.target.closest(".cform");if(!f)return;e.preventDefault();
  const ad=ads.find(a=>a.id===f.dataset.ad),stat=f.querySelector(".cstat"),btn=f.querySelector(".cbtn");
  const name=f.elements.name.value.trim(),text=f.elements.text.value.trim();
  if(!name){stat.textContent="Add your name first.";return}if(!text){stat.textContent="Write a comment first.";return}
  btn.disabled=true;stat.textContent="Saving…";
  const send=u=>fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({ad:ad.id,name,text})});
  send(CAPI[0]).catch(()=>send(CAPI[1])).then(r=>r.json().then(j=>r.ok?j:Promise.reject(j.error||"Couldn't save the comment.")))
    .then(j=>{cm.byAd[ad.id]=j.comments||[];cm.draft[ad.id]="";fillComments(ad);const s=$("#cbox .cstat");if(s)s.textContent="Comment added."})
    .catch(err=>{btn.disabled=false;stat.textContent=typeof err==="string"?err:"Couldn't save the comment."});
});

/* ------------------------------------------------------------------ campaigns */
function renderCampaigns(){
  const byC=new Map();ads.forEach(a=>{if(!byC.has(a.campaign))byC.set(a.campaign,[]);byC.get(a.campaign).push(a)});
  const rows=sortTable([...byC].map(([c,list])=>({c,list,m:agg(list),obj:list[0].objective})),x=>x.m.spend);
  const d=DATA.daily||[],maxS=Math.max(...d.map(x=>x.spend),1),W=640,H=120;
  const pts=d.map((x,i)=>[d.length>1?i/(d.length-1)*(W-20)+10:W/2,H-18-(x.spend/maxS)*(H-34)]);
  $("#main").innerHTML=`
  <div class="grid kpis">${kpi("Spend",money(ALL.spend),num(ALL.impr)+" impressions")}${kpi("Link clicks",num(ALL.linkClicks||ALL.clicks),"CTR "+pct(BASE.ctr,2))}${kpi("Results",num(ALL.results),BASE.cpa==null?"":"CPA "+money(BASE.cpa))}${kpi("Revenue",ALL.value?money(ALL.value):"–",BASE.roas==null?"":"ROAS "+BASE.roas.toFixed(2))}</div>
  ${d.length>1?`<section class="sec"><h2>Daily spend</h2><div class="card"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Daily spend"><polyline fill="none" stroke="var(--accent)" stroke-width="2" points="${pts.map(p=>p.join(",")).join(" ")}"/>
    <text x="10" y="12">${money(maxS,0)}</text><text x="10" y="${H-4}">${esc(d[0].date)}</text><text x="${W-10}" y="${H-4}" text-anchor="end">${esc(d[d.length-1].date)}</text></svg></div></section>`:""}
  <section class="sec"><h2>Campaigns</h2><div class="tscroll"><table><thead><tr><th>Campaign</th><th>Ads</th><th>Spend</th><th>Impr.</th><th>CTR</th><th>CPC</th><th>Results</th><th>CPA</th><th>ROAS</th></tr></thead><tbody>
  ${rows.map(x=>{const r=rates(x.m);return `<tr><td class="name"><b>${esc(x.c)}</b><div class="small">${esc((x.obj||"").replace("OUTCOME_","").toLowerCase())}</div></td><td>${x.list.length}</td><td>${money(x.m.spend)}</td><td>${num(x.m.impr)}</td><td>${pct(r.ctr,2)}</td><td>${r.cpc==null?"–":money(r.cpc)}</td><td>${num(x.m.results)}</td><td>${r.cpa==null?"–":money(r.cpa)}</td><td>${r.roas==null?"–":r.roas.toFixed(2)}</td></tr>`}).join("")}
  </tbody></table></div></section>`;
}

/* ------------------------------------------------------------------ boot */
function render(){renderHeader();({creative:renderCreative,ads:renderAds,campaigns:renderCampaigns}[state.tab]||renderCreative)()}
{const m=location.hash.match(/^#ad-(.+)$/);if(m&&ads.some(a=>a.id===m[1])){state.sel=m[1];state.tab="ads"}}
if(!ads.length)$("#main").innerHTML=`<div class="card empty">No ads were returned for this account in the selected range.</div>`;else render();
</script>
