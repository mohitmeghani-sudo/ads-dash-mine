<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__CLIENT__ Ad Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#F2F3F6;--surface:#FFFFFF;--sunk:#E9EBF0;--ink:#161B26;--muted:#5A6273;--faint:#8A91A0;--line:#DCE0E7;
  --accent:#1B5FD1;--accent-soft:#E1EBFB;--on-accent:#FFFFFF;
  --win:#137333;--win-bg:#E3F2E7;--avg:#B45F06;--avg-bg:#FCEFDF;--lose:#C5221F;--lose-bg:#FBE7E6;--early:#5A6273;--early-bg:#ECEEF2;
  --bf:#7A2E9E;--bf-bg:#F3E6FA;
  --f1:#1B5FD1;--f2:#2E7DE0;--f3:#5C9BEA;--f4:#8DBAF0;--f5:#BBD5F6;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --ui:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --ground:#0E1117;--surface:#161A22;--sunk:#1D222C;--ink:#E7EAF0;--muted:#A0A8B7;--faint:#6F7788;--line:#29303C;
  --accent:#6AA4FF;--accent-soft:#16294A;--on-accent:#0E1117;
  --win:#6DD58C;--win-bg:#15321F;--avg:#F2B061;--avg-bg:#3A2A14;--lose:#F28B82;--lose-bg:#3C1C1A;--early:#A0A8B7;--early-bg:#232833;
  --bf:#D9A7F2;--bf-bg:#2E1B3B;
  --f1:#6AA4FF;--f2:#5590EE;--f3:#4379D0;--f4:#3563AB;--f5:#2B4E86;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0E1117;--surface:#161A22;--sunk:#1D222C;--ink:#E7EAF0;--muted:#A0A8B7;--faint:#6F7788;--line:#29303C;
  --accent:#6AA4FF;--accent-soft:#16294A;--on-accent:#0E1117;
  --win:#6DD58C;--win-bg:#15321F;--avg:#F2B061;--avg-bg:#3A2A14;--lose:#F28B82;--lose-bg:#3C1C1A;--early:#A0A8B7;--early-bg:#232833;
  --bf:#D9A7F2;--bf-bg:#2E1B3B;
  --f1:#6AA4FF;--f2:#5590EE;--f3:#4379D0;--f4:#3563AB;--f5:#2B4E86;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:14px/1.45 var(--ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em}
.wrap{max-width:1400px;margin:0 auto;padding:18px 16px 60px}
header.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;justify-content:space-between;margin-bottom:10px}
h1{font-size:26px;font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px;color:var(--muted)}
.meta b{color:var(--ink)}
.badge-sample{background:var(--lose-bg);color:var(--lose);font-weight:700;padding:2px 8px;border-radius:6px;font-size:12px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:6px 0 16px;flex-wrap:wrap}
.tab{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab.bf[aria-selected="true"]{border-bottom-color:var(--bf)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.kpi{padding:12px 14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font:700 22px var(--display);margin-top:2px}
.kpi .s{font-size:12px;color:var(--faint)}
.two{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}
.three{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
@media(max-width:480px){.two{grid-template-columns:1fr}}
.sec{margin-top:24px}
.sec>h2{font-size:18px;margin-bottom:4px}
.sec>p.sub{margin:0 0 10px;color:var(--muted);font-size:13px;max-width:90ch}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.v-win{background:var(--win-bg);color:var(--win)}.v-lose{background:var(--lose-bg);color:var(--lose)}
.v-avg{background:var(--avg-bg);color:var(--avg)}.v-early{background:var(--early-bg);color:var(--early)}
.v-bf{background:var(--bf-bg);color:var(--bf)}
.tag{display:inline-block;background:var(--sunk);color:var(--muted);font-size:11px;font-weight:600;padding:1px 7px;border-radius:5px;margin-right:4px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--surface);cursor:pointer;user-select:none;z-index:2}
th.sorted{color:var(--ink)}th.sorted::after{content:" ▾";color:var(--accent)}th.asc::after{content:" ▴"}
th.nosort{cursor:default}
.tscroll{overflow:auto;max-height:640px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
tr[data-open]{cursor:pointer}tr[data-open]:hover td{background:var(--accent-soft)}
td.lead{white-space:normal;min-width:260px;max-width:380px;text-align:left}
td.cb,th.cb{width:34px;padding-right:0;text-align:center}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--sunk);flex:none}
.thumb.ph{display:grid;place-items:center;color:var(--faint);font-size:11px}
.row{display:flex;gap:10px;align-items:center}
.small{font-size:12px;color:var(--muted)}
.mono{font-family:var(--mono)}
.cell-bar{position:relative;min-width:68px}
.cell-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent-soft);z-index:0;border-radius:0 4px 4px 0}
.cell-bar span{position:relative;z-index:1}
.funnel{display:grid;gap:5px}
.frow{display:grid;grid-template-columns:88px 1fr 92px;gap:8px;align-items:center;font-size:12px}
.frow .bar{height:14px;background:var(--sunk);border-radius:4px;overflow:hidden}
.frow .bar i{display:block;height:100%;border-radius:4px}
.frow b{text-align:right;font-family:var(--mono);font-weight:500}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 12px}
select,input[type=search],input[type=text]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:6px 12px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.mergebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:8px 12px;margin:0 0 10px}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:8px;padding:7px 14px;font-weight:700;cursor:pointer}
.btn.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.fb{max-width:480px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;color:var(--ink)}
.fb .h{display:flex;gap:10px;align-items:center;padding:10px 12px}
.fb .av{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700}
.fb .pt{padding:0 12px 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.fb .md{background:var(--sunk);aspect-ratio:1/1;display:grid;place-items:center;color:var(--faint);position:relative;text-align:center;padding:12px}
.fb .md img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
.fb .ct{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--sunk)}
.fb .ct .u{font-size:11px;color:var(--muted);text-transform:uppercase}
.fb .ct b{display:block;font-size:14px}
.fb .btn2{background:var(--line);color:var(--ink);border-radius:6px;padding:7px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.dyn{background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0 5px;font-size:12px;font-weight:600}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px}
.mgrid div{background:var(--sunk);border-radius:8px;padding:8px 10px}
.mgrid span{font-size:11px;color:var(--muted);display:block}
.mgrid b{font:700 16px var(--display)}
a{color:var(--accent);font-weight:600;text-decoration:none}a:hover{text-decoration:underline}
.cform{display:grid;gap:8px;margin:8px 0}
.cform input,.cform textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.clist{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:8px}
.clist li{background:var(--sunk);border-radius:8px;padding:8px 10px}
.clist .chead{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.clist p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.sr{position:absolute;left:-9999px}
.empty{color:var(--muted);padding:18px;text-align:center}
.note{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted)}
.li{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;margin-top:8px}
.li .tx{min-width:0;flex:1}.li .tx b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.up{color:var(--win);font-weight:700}.down{color:var(--lose);font-weight:700}.flat{color:var(--muted)}
tr.sub td{background:var(--sunk);padding:6px 10px}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--ground);border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.18);overflow:auto;transform:translateX(102%);transition:transform .18s;z-index:50;padding:14px}
#drawer.open{transform:none}
#drawer .x{position:sticky;top:0;float:right;z-index:3}
iframe.live{width:100%;max-width:440px;height:680px;border:1px solid var(--line);border-radius:10px;background:#fff}
svg text{font:11px var(--ui);fill:var(--muted)}
.vdef .vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
.vdef label{display:grid;gap:3px;font-size:12px;color:var(--muted);font-weight:600}
.vdef input[type=number]{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.vdef label.chk{display:flex;gap:6px;align-items:center;align-self:center}
.vdefs{display:grid;gap:6px;margin-top:12px}
.vdefs div{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.vdefs .chip{min-width:92px;justify-content:center}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.pv{background:var(--sunk);border-radius:10px;min-height:260px;display:grid;place-items:center;position:relative;overflow:hidden}
.pv>img{width:100%;height:auto;display:block;max-height:560px;object-fit:contain;background:#000}
.pv .pvmsg{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(0,0,0,.68);color:#fff;border-radius:8px;padding:6px 10px;font-size:12px}
.pv iframe{border:0;background:#fff;max-width:100%;display:block;margin:0 auto}
.hero{width:100%;max-height:520px;object-fit:contain;background:#000;border-radius:10px;display:block}
.ptext{white-space:pre-wrap;overflow-wrap:anywhere;margin:10px 0 0}
.kv{display:grid;gap:2px;margin-top:8px;font-size:13px}.kv b{font-weight:600}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1><span id="client">__CLIENT__</span> Ad Dashboard</h1>
      <div class="meta" id="meta"></div>
    </div>
    <button class="btn alt" id="theme" type="button" aria-label="Switch light or dark theme">Theme</button>
  </header>
  <div class="tabs" role="tablist" id="tabs"></div>
  <main id="main"></main>
</div>
<aside id="drawer" aria-label="Details"></aside>

<script>
const DATA=/*__DATA__*/null;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get(k,d){try{const v=localStorage.getItem("meta."+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("meta."+k,JSON.stringify(v))}catch(e){}}};
const CUR=(DATA.account&&DATA.account.currency)||"USD";
const CFG=DATA.config||{creators:[],skus:[],overrides:{}};
const ads=DATA.ads;
const RESKEY=(DATA.account&&DATA.account.resultKind||"purchase")==="purchase"?"purchases":"results";
const RESLBL=RESKEY==="purchases"?"Purchases":"Results";
const T=DATA.targets||{};

/* ------------------------------------------------------------------ numbers */
const money=v=>{if(v==null||!isFinite(v))return"–";try{return new Intl.NumberFormat("en-US",{style:"currency",currency:CUR,maximumFractionDigits:Math.abs(v)>=100?0:2}).format(v)}catch(e){return (+v).toFixed(2)}};
const num=v=>v==null?"–":Math.round(v).toLocaleString("en-US");
const pct=(v,d=1)=>v==null||!isFinite(v)?"–":(v*100).toFixed(d)+"%";
const x2=v=>v==null||!isFinite(v)?"–":v.toFixed(2);
const div=(a,b)=>b>0?a/b:null;
const FIELDS=["spend","impr","reach","clicks","linkClicks","results","purchases","value","engagement","plays3s","p25","p50","p75","p95","p100","thruplay","s30","addToCart"];
function agg(list){
  const t={};FIELDS.forEach(f=>t[f]=0);let w=0,aw=0;
  list.forEach(a=>{FIELDS.forEach(f=>t[f]+=(a.m[f]||0));if(a.m.plays3s){aw+=(a.m.avgWatch||0)*a.m.plays3s;w+=a.m.plays3s}});
  t.avgWatch=w?aw/w:0;return t;
}
function rates(m){
  const clicks=m.linkClicks||m.clicks,res=m[RESKEY];
  return {ctr:div(clicks,m.impr),cpc:div(m.spend,clicks),cpm:m.impr?m.spend/m.impr*1000:null,eng:div(m.engagement,m.impr),
    cpa:div(m.spend,res),roas:div(m.value,m.spend),aov:div(m.value,m.purchases),cvr:div(res,clicks),
    hook:div(m.plays3s,m.impr),hold:div(m.thruplay,m.plays3s),r25:div(m.p25,m.plays3s),r50:div(m.p50,m.plays3s),r75:div(m.p75,m.plays3s),r95:div(m.p95,m.plays3s),r100:div(m.p100,m.plays3s)};
}

/* ------------------------------------------------------------------ reading ad names
   Names look like  Ad456_Static_Brand_Baby_I-almost-gave-up_V1_Vertical – Copy
   Ad number = the creative. Copies, versions, placements and ad sets of the same Ad number are one creative.
   Format / Brand-or-Creator / SKU / creator handle / hook are read from the name's words. clients.json can override. */
const norm=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
const FMT_WORDS={video:"Video",reel:"Video",reels:"Video",static:"Static",image:"Static",gif:"Static",catalog:"Catalog",carousel:"Carousel"};
const SRC_BRAND=/^(brand|branded|founder)$/i,SRC_CR=/^(whitelist|whitelisted|wl|partnership|influencer|creator|ugc)$/i;
const PLACE=/^(vertical|square|horizontal|story|stories|feed|9x16|1x1|4x5|16x9|916|11|45)$/i;
const SKU_LABEL={baby:"Baby",all:"All",longterm:"Long-Term",reliefkit:"Relief Kit",activeflare:"Active Flare"};
const SKUS=(()=>{const m={...SKU_LABEL};(CFG.skus||[]).forEach(s=>{const n=norm(s);if(n&&!m[n])m[n]=String(s).replace(/([a-z])([A-Z])/g,"$1 $2")});return m})();
const CREATORS=(CFG.creators||[]).map(c=>{const [h,al]=String(c).split("=");const handle="@"+h.replace(/^@/,"").toLowerCase();
  const keys=new Set([norm(handle)]);const pre=norm(handle.replace(/^@/,"").split(/[_.]/)[0]);if(pre.length>=5)keys.add(pre);
  (al||"").split(",").forEach(a=>{const n=norm(a);if(n.length>=4)keys.add(n)});return{handle,keys:[...keys]}});
const stripCopy=s=>{let p,n=String(s||"").trim();do{p=n;n=n.replace(/\s*(?:[–—-]\s*)?copy(?:\s*\d+)?\s*$/i,"").replace(/\s*\(\d+\)\s*$/,"").trim()}while(n!==p);return n};
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
function isBF(raw){return /black[\s_-]*friday/i.test(raw)||/(^|[^a-z])bf(?![a-z])/i.test(raw)}
function placeholderless(t){return String(t||"").replace(/\{\{[^}]*\}\}/g,"").trim()}
function parseAd(a){
  const raw=a.name||"",base=stripCopy(raw);
  const num=(base.match(/(?:^|[^a-z])ad[\s_-]*0*(\d+)/i)||[])[1]||"";
  const normAll=norm(base),fmts=new Set(),used=new Set();let src="",sku="",creator="",ver="",work=base;
  /* handles contain "_" / "." which are also the name separators: cut a known handle out of the name before splitting into words */
  CREATORS.forEach(c=>{if(creator)return;
    const re=new RegExp("@?"+c.handle.slice(1).replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/_/g,"[_ .-]?")+"(?![a-z0-9])","i");
    if(re.test(work)){creator=c.handle;work=work.replace(re," ")}});
  const tokens=work.split(/[_\s]+/).filter(Boolean);
  CREATORS.forEach(c=>{if(!creator&&c.keys.some(k=>normAll.includes(k)))creator=c.handle});
  tokens.forEach((t,i)=>{
    const n=norm(t);
    if(/^ad\d+$/i.test(t)||(i===0&&/^ad$/i.test(t))){used.add(i);return}
    if(FMT_WORDS[n]){fmts.add(FMT_WORDS[n]);used.add(i);return}
    if(SRC_BRAND.test(t)){src="Brand";used.add(i);return}
    if(SRC_CR.test(t)){if(src!=="Brand")src="Creator";used.add(i);return}
    if(SKUS[n]){if(!sku)sku=SKUS[n];used.add(i);return}
    if(/^v\d+$/i.test(t)){ver=t.toUpperCase();used.add(i);return}
    if(PLACE.test(t)||/^(bf\d*|blackfriday\d*)$/i.test(t)){used.add(i);return}
    if(t.startsWith("@")){if(!creator)creator=t.toLowerCase().replace(/[^@a-z0-9._]/g,"");used.add(i);return}
    if(creator&&CREATORS.some(c=>c.handle===creator&&c.keys.some(k=>n===k||(n.length>=5&&n.includes(k))))){used.add(i);return}
  });
  const fmt=fmts.has("Catalog")?"Catalog":fmts.has("Video")?"Video":fmts.has("Carousel")?"Carousel":fmts.has("Static")?"Static":(a.format==="Image"?"Static":a.format);
  let hook=cap(tokens.filter((t,i)=>!used.has(i)).join(" ").replace(/-/g," ").replace(/\s+/g," ").trim());
  let hookFrom="name";
  if(!hook){const line=placeholderless(a.body).split(/\n/)[0].trim()||placeholderless(a.title);hook=line.length>110?line.slice(0,109)+"…":line;hookFrom="copy"}
  let p={num,fmt,source:src||(creator?"Creator":"Brand"),sku,creator,hook,hookFrom,ver,bf:isBF(raw),
    key:num?"ad"+num:norm(base)||a.id};
  const ov=(CFG.overrides||{});const o=ov["Ad"+num]||ov["ad"+num]||ov[raw]||ov[base];
  if(o){["creator","hook","sku","source","fmt"].forEach(k=>{if(o[k]!=null)p[k]=o[k]});if(o.format)p.fmt=o.format;if(o.bf!=null)p.bf=!!o.bf}
  p.title=p.hook||(num?"Ad"+num:raw);
  return p;
}
ads.forEach(a=>{a.p=parseAd(a);a.active=a.status==="ACTIVE"});

/* ------------------------------------------------------------------ status labels (Meta's effective_status) */
const STATUS_LBL={ACTIVE:"Active",PAUSED:"Paused",ADSET_PAUSED:"Ad set paused",CAMPAIGN_PAUSED:"Campaign paused",ARCHIVED:"Archived",DELETED:"Deleted",PENDING_REVIEW:"In review",DISAPPROVED:"Disapproved",WITH_ISSUES:"With issues",IN_PROCESS:"Processing",PREAPPROVED:"Pre-approved",PENDING_BILLING_INFO:"Billing issue"};
const statusLbl=s=>STATUS_LBL[s]||String(s||"Unknown").toLowerCase().replace(/_/g," ").replace(/^./,x=>x.toUpperCase());

/* ------------------------------------------------------------------ smart grouping: ads -> creatives
   Ads are one creative when they share the Ad number in the name, OR the same video, OR the same image,
   OR (same hook words in the name + same format + same creator), OR (static ads with identical primary text + headline).
   Catalog / dynamic ads are never joined on copy because their text is a placeholder. Manual merges sit on top of this. */
let SMART=store.get("smart",true);
function clusterAds(){
  const par={},find=x=>{while(par[x]!==x){par[x]=par[par[x]];x=par[x]}return x};
  const uni=(x,y)=>{if(!(x in par))par[x]=x;if(!(y in par))par[y]=y;const a=find(x),b=find(y);if(a!==b)par[a]=b};
  ads.forEach(a=>{
    const sig=["k:"+a.p.key];
    if(SMART){
      if(a.videoId)sig.push("v:"+a.videoId);
      if(a.imageHash)sig.push("i:"+a.imageHash);
      if(a.p.hookFrom==="name"&&norm(a.p.hook).length>=12)sig.push("h:"+norm(a.p.hook)+"|"+a.p.fmt+"|"+a.p.creator);
      const txt=norm(placeholderless(a.body)+"|"+placeholderless(a.title));
      if(a.p.fmt==="Static"&&!a.imageHash&&!isDyn(a)&&txt.length>=40)sig.push("t:"+txt);
    }
    sig.forEach(s=>uni("a:"+a.id,s));
  });
  const members={};
  ads.forEach(a=>{const r=find("a:"+a.id);(members[r]||(members[r]=[])).push(a)});
  Object.values(members).forEach(l=>{const key=l.map(a=>a.p.key).sort()[0];l.forEach(a=>a.ck=key)});
}

function benchSrc(id){return V.bench==="custom"&&parseFloat(V.custom)>0?"your target":((id==="roas"&&T.roas)||(id==="cpa"&&T.cpa)||(id==="hook"&&T.hookRate))?"client target":"account average"}
function verdict(m,isVideo){
  const r=rates(m),why=[],minS=+V.minSpend||0,minI=+V.minImpr||0;
  if(m.impr<minI||m.spend<minS)return{k:"early",label:"Too early",why:["Below the 'too early' floor: "+money(m.spend)+" spend, "+num(m.impr)+" impressions (needs "+money(minS)+" and "+num(minI)+")"],score:0};
  let id=curId();
  if(VM[id].video&&!isVideo){id=autoId();why.push(VM[curId()].l+" is video-only, judged on "+VM[id].l+" instead")}
  const s=VM[id],val=r[id],b=benchFor(id);
  if(V.zeroRes&&hasResults&&["roas","cpa","cvr"].includes(id)&&m[RESKEY]===0){why.push(money(m.spend)+" spent, no "+RESLBL.toLowerCase());return{k:"lose",label:"Not working",why,score:-2}}
  if(val==null||!b){why.push("No "+s.l+" yet");return{k:"avg",label:"Average",why,score:0}}
  const q=val/b,w=V.win/100,l=V.lose/100;

  why.push(s.l+" "+s.f(val)+" vs "+s.f(b)+" "+benchSrc(id));
  if(V.metric==="auto"&&isVideo&&r.hook!=null&&VBASE.hook){
    const t=T.hookRate||VBASE.hook,hq=r.hook/t;why.push("Hook rate "+pct(r.hook)+" vs "+pct(t)+(T.hookRate?" target":" video avg"));
    if(score===0)score=hq>=1.2?.5:hq<=.75?-.5:0;

}

/* ------------------------------------------------------------------ tab: Previews (real Meta previews) */
const PV_FORMATS=[["MOBILE_FEED_STANDARD","Facebook mobile feed"],["DESKTOP_FEED_STANDARD","Facebook desktop feed"],["INSTAGRAM_STANDARD","Instagram feed"],["INSTAGRAM_STORY","Instagram story"],["INSTAGRAM_REELS","Instagram reels"],["FACEBOOK_REELS_MOBILE","Facebook reels"]];
const pvCache={};
function loadPreview(box,adId,fmt){
  const key=adId+"|"+fmt,done=r=>{const old=box.querySelector(".pvmsg");old&&old.remove();
    const img=box.querySelector(":scope>img");if(img)img.remove();const prev=box.querySelector("iframe");prev&&prev.remove();
    const w=r.width||340,h=r.height||600,avail=box.clientWidth||w,sc=Math.min(1,avail/w);
    box.style.display="block";box.style.height=Math.round(h*sc)+"px";
    box.insertAdjacentHTML("beforeend",`<iframe src="${esc(r.src)}" title="Meta ad preview" scrolling="no" style="width:${w}px;height:${h}px;transform:scale(${sc});transform-origin:top left;margin-left:${Math.max(0,Math.round((avail-w*sc)/2))}px"></iframe>`)};
  if(pvCache[key])return done(pvCache[key]);
  fetch("api/preview?ad="+encodeURIComponent(adId)+"&format="+encodeURIComponent(fmt),{cache:"no-store"}).then(r=>r.json().then(j=>r.ok?j:Promise.reject(j.error||"No preview")))
    .then(j=>{pvCache[key]=j;done(j)}).catch(err=>{const m=box.querySelector(".pvmsg");if(m)m.textContent="Meta's live preview isn't available for this ad ("+(typeof err==="string"?err.slice(0,120):"request failed")+"). Showing the creative image instead."});
}
let pvObserver=null;
function watchPreviews(){
  if(pvObserver)pvObserver.disconnect();
  if(!("IntersectionObserver" in window)){document.querySelectorAll(".pv[data-ad]").forEach(b=>loadPreview(b,b.dataset.ad,state.pvfmt));return}
  pvObserver=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){pvObserver.unobserve(e.target);loadPreview(e.target,e.target.dataset.ad,state.pvfmt)}}),{rootMargin:"300px"});
  document.querySelectorAll(".pv[data-ad]").forEach(b=>pvObserver.observe(b));
}
function renderPreviews(){
  refilter();
  const list=D.creatives.slice().sort((a,b)=>b.m.spend-a.m.spend),n=state.pvN;
  const fb=DATA.sample;
  $("#main").innerHTML=`<section class="sec" style="margin-top:0"><h2>Ad previews</h2><p class="sub">Each creative as Meta itself renders it (the same preview you get in Ads Manager), loaded as you scroll. The still image is shown while it loads, or if Meta can't render a preview for that ad. Each card previews the creative's top-spending ad.</p>
    ${filters()}
    <div class="ctrl"><label class="small">Placement <select id="pvfmt">${PV_FORMATS.map(([v,l])=>`<option value="${v}" ${state.pvfmt===v?"selected":""}>${l}</option>`).join("")}</select></label><span class="small">${list.length} creatives</span></div>
    <div class="pgrid">${list.slice(0,n).map(g=>`<div class="card"><div class="row" style="justify-content:space-between;align-items:flex-start;margin-bottom:8px"><div style="min-width:0"><b>${esc(g.name)}</b><div class="small">${money(g.m.spend)} · ${num(g.m[RESKEY])} ${RESLBL.toLowerCase()} · ${g.ads.length} ad${g.ads.length>1?"s":""}</div></div>${chip(g.v)}</div>
      <div class="pv" ${fb?"":`data-ad="${esc(g.rep.id)}"`}>${g.thumb?`<img src="${esc(g.thumb)}" alt="${esc(g.name)}" loading="lazy">`:`<span class="small">${g.fmt==="Catalog"?"Catalog ad":"No image saved"}</span>`}${fb?"":`<div class="pvmsg">Loading Meta preview…</div>`}</div>
      <p class="small" style="margin:8px 0 0"><a href="#cr-${encodeURIComponent(g.key)}" data-open="cr|${esc(g.key)}">Details</a>${g.rep.previewLink?` · <a href="${esc(g.rep.previewLink)}" target="_blank" rel="noopener">Open Meta preview link</a>`:""}${g.thumb?` · <a href="${esc(g.thumb)}" target="_blank" rel="noopener">Full-size image</a>`:""}</p></div>`).join("")}</div>
    ${list.length>n?`<p style="margin-top:12px"><button class="btn alt" type="button" data-pvmore>Show more (${list.length-n} left)</button></p>`:""}</section>`;
  bindFilters(renderPreviews);
  const s=$("#pvfmt");s&&(s.onchange=e=>{state.pvfmt=e.target.value;store.set("pvfmt",state.pvfmt);renderPreviews()});
  watchPreviews();

function funnel(m){
  const r=rates(m);if(!m.plays3s)return`<div class="small">No video plays recorded.</div>`;
  const rows=[["Impressions",1,num(m.impr),"var(--f5)"],["3s plays",m.plays3s/m.impr,pct(r.hook)+" of impr.","var(--f1)"],["25% watched",r.r25*m.plays3s/m.impr,pct(r.r25)+" of 3s","var(--f2)"],["50% watched",r.r50*m.plays3s/m.impr,pct(r.r50)+" of 3s","var(--f3)"],["75% watched",r.r75*m.plays3s/m.impr,pct(r.r75)+" of 3s","var(--f4)"],["95% watched",r.r95*m.plays3s/m.impr,pct(r.r95)+" of 3s","var(--f5)"],["ThruPlay",r.hold*m.plays3s/m.impr,pct(r.hold)+" of 3s","var(--f3)"]];
  const max=Math.max(...rows.map(x=>x[1]),.0001);
  return`<div class="funnel">${rows.map(([l,w,t,c])=>`<div class="frow"><span>${l}</span><div class="bar"><i style="width:${Math.max(2,w/max*100)}%;background:${c}"></i></div><b>${t}</b></div>`).join("")}</div>`;
}
const CTAS={SHOP_NOW:"Shop now",LEARN_MORE:"Learn more",SIGN_UP:"Sign up",BUY_NOW:"Buy now",ORDER_NOW:"Order now",GET_OFFER:"Get offer",SUBSCRIBE:"Subscribe",CONTACT_US:"Contact us",NO_BUTTON:""};
const cta=c=>c in CTAS?CTAS[c]:String(c||"").toLowerCase().replace(/_/g," ").replace(/^./,x=>x.toUpperCase());
/* Catalog ads store "{{product.name}}" placeholders: Meta fills them per viewer from the product feed. Show that instead of raw braces. */
const dyn=t=>esc(t).replace(/\{\{\s*product\.(\w+)\s*\}\}/g,(_,f)=>`<span class="dyn">Product ${esc(f)}</span>`);
const isDyn=a=>/\{\{[^}]*\}\}/.test((a.body||"")+(a.title||""))||a.p.fmt==="Catalog";
function mock(a){
  const host=(a.url||DATA.domain||"").replace(/^https?:\/\//,"").split("/")[0];
  const img=a.thumb?`<a href="${esc(a.thumb)}" target="_blank" rel="noopener" title="Open full-size image"><img class="hero" src="${esc(a.thumb)}" alt="Creative image" loading="lazy"></a>`
    :`<div class="note">${a.p.fmt==="Video"?"No video thumbnail could be saved.":a.p.fmt==="Catalog"?"Catalog ad: Meta builds the images from your product feed for each viewer.":"No image could be saved."} See the Meta preview above.</div>`;
  const text=(a.body||"").trim();
  return`<div class="card"><h3 style="margin-bottom:8px">Creative</h3>${img}
    ${text?`<p class="ptext">${dyn(text)}</p>`:""}
    <div class="kv">${a.title?`<div><span class="small">Headline</span> <b>${dyn(a.title)}</b></div>`:""}${a.description?`<div><span class="small">Description</span> ${dyn(a.description)}</div>`:""}${cta(a.cta)?`<div><span class="small">Button</span> <b>${esc(cta(a.cta))}</b></div>`:""}${host?`<div><span class="small">Link</span> ${esc(host)}</div>`:""}</div>
    ${isDyn(a)?`<p class="small" style="margin:8px 0 0">Catalog / dynamic ad: highlighted fields are filled by Meta per viewer from the product feed, so what people see varies.</p>`:""}</div>`;
}
function metricsGrid(m){const r=rates(m);return`<div class="mgrid"><div><span>Spend</span><b>${money(m.spend)}</b></div><div><span>Impressions</span><b>${num(m.impr)}</b></div><div><span>Clicks</span><b>${num(m.linkClicks||m.clicks)}</b></div><div><span>CTR</span><b>${pct(r.ctr,2)}</b></div><div><span>Eng. rate</span><b>${pct(r.eng,2)}</b></div><div><span>${RESLBL}</span><b>${num(m[RESKEY])}</b></div><div><span>CPA</span><b>${money(r.cpa)}</b></div><div><span>ROAS</span><b>${x2(r.roas)}</b></div><div><span>Revenue</span><b>${money(m.value)}</b></div><div><span>AOV</span><b>${money(r.aov)}</b></div><div><span>CVR</span><b>${pct(r.cvr,1)}</b></div><div><span>CPC</span><b>${money(r.cpc)}</b></div></div>`}
function openDrawer(kind,id){
  state.open={kind,id};const dr=$("#drawer");
  let g,a,title,sub,m,v,cmtKey;
  if(kind==="cr"){g=FULL.byKey[id];if(!g)return;a=g.rep;title=g.name;m=g.m;v=g.v;cmtKey="c:"+g.key;
    sub=`${g.p.num?"Ad"+g.p.num+" · ":""}${g.ads.length} ad${g.ads.length>1?"s":""} in ${g.adsets} ad set${g.adsets>1?"s":""}`}
  else{a=FULL.adById[id];if(!a)return;title=a.name;m=a.m;v=verdict(a.m,a.p.fmt==="Video");cmtKey=a.id;sub=a.campaign+" › "+a.adset}
  const members=kind==="cr"&&g.ads.length>1?`<div class="card"><h3 style="margin-bottom:6px">Ads in this creative</h3><div class="tscroll" style="max-height:260px"><table><thead><tr><th class="nosort">Ad</th><th class="nosort">Spend</th><th class="nosort">${RESLBL}</th><th class="nosort">ROAS</th></tr></thead><tbody>${g.ads.slice().sort((x,y)=>y.m.spend-x.m.spend).map(x=>{const r=rates(x.m);return`<tr data-open="ad|${esc(x.id)}"><td class="lead"><b>${esc(x.name)}</b><div class="small">${esc(x.campaign)} › ${esc(x.adset)}</div></td><td>${money(x.m.spend)}</td><td>${num(x.m[RESKEY])}</td><td>${x2(r.roas)}</td></tr>`}).join("")}</tbody></table></div>${g.manual?`<p style="margin:8px 0 0"><button class="btn alt" data-unmerge="${esc(g.key.slice(2))}">Unmerge these ads</button></p>`:""}</div>`:"";
  dr.innerHTML=`<button class="btn alt x" data-close type="button">Close ✕</button>
    <div class="grid" style="gap:12px;clear:both">
    <div class="card"><div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:8px"><div><h3>${esc(title)}</h3><div class="small">${esc(sub)}</div><div style="margin-top:4px">${tags(a.p)}${(kind==="cr"?g.bf:a.p.bf)?'<span class="chip v-bf">Black Friday</span>':""}</div></div>${chip(v)}</div><p class="small" style="margin:8px 0 0">${v.why.map(esc).join(" · ")}</p></div>
 <div class="card"><h3 style="margin-bottom:8px">Meta preview <span class="small">as Meta renders it</span></h3><div class="ctrl" style="margin-top:0"><select id="pfmt" aria-label="Placement">${PV_FORMATS.map(([v,l])=>`<option value="${v}" ${state.pvfmt===v?"selected":""}>${l}</option>`).join("")}</select></div><div id="pbox" class="pv" data-drawer="1" data-ad="${esc(a.id)}">${a.thumb?`<img src="${esc(a.thumb)}" alt="">`:""}<div class="pvmsg">Loading Meta preview…</div></div></div>
    ${mock(a)}
    <div class="card"><h3 style="margin-bottom:8px">Performance <span class="small">${esc(DATA.dateRange)}</span></h3>${metricsGrid(m)}</div>
    ${m.plays3s?`<div class="card"><h3 style="margin-bottom:8px">Video retention${a.videoLength?` <span class="small">${a.videoLength}s video</span>`:""}</h3>${funnel(m)}</div>`:""}
    ${members}
    <div class="card"><h3 style="margin-bottom:6px">Links</h3><p class="small" style="margin:0">${[a.previewLink?`<a href="${esc(a.previewLink)}" target="_blank" rel="noopener">Open Meta shareable preview</a>`:"",a.permalink?`<a href="${esc(a.permalink)}" target="_blank" rel="noopener">View post</a>`:"",a.url?`<a href="${esc(a.url)}" target="_blank" rel="noopener">Landing page</a>`:"",a.thumb?`<a href="${esc(a.thumb)}" target="_blank" rel="noopener">Full-size image</a>`:""].filter(Boolean).join(" · ")||"No links available."}</p></div>
    <section class="card" id="cbox" hidden></section></div>`;
  dr.classList.add("open");dr.scrollTop=0;loadComments(cmtKey);
  const pb=$("#pbox");if(pb&&!DATA.sample)loadPreview(pb,a.id,$("#pfmt").value);else if(pb){const mm=pb.querySelector(".pvmsg");mm&&mm.remove()}
  try{history.replaceState(null,"","#"+kind+"-"+encodeURIComponent(id))}catch(e){}
}
function closeDrawer(){state.open=null;$("#drawer").classList.remove("open");try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}}

/* ------------------------------------------------------------------ comments (same endpoints as the Google dashboards) */
const cm={on:null,by:{},draft:{},cur:""};
const CAPI=["api/notes","api/comments"];
const whenText=iso=>{const d=new Date(iso);return isNaN(d)?iso:d.toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})};
function commentInner(key,list){
  return`<h3>Comments <span class="small">${list.length}</span></h3><form class="cform" data-ad="${esc(key)}"><label class="sr" for="cName">Your name</label><input id="cName" name="name" maxlength="80" placeholder="Your name" value="${esc(store.get("commentName",""))}">
    <label class="sr" for="cText">Comment</label><textarea id="cText" name="text" maxlength="2000" rows="3" placeholder="Add a comment on this creative">${esc(cm.draft[key]||"")}</textarea>
    <div class="row"><button type="submit" class="btn">Add comment</button><span class="cstat small" role="status"></span></div></form>
    ${list.length?`<ul class="clist">${list.map(c=>`<li><div class="chead"><b>${esc(c.name)}</b><span>${esc(whenText(c.at))}</span></div><p>${esc(c.text)}</p></li>`).join("")}</ul>`:`<p class="small">No comments yet.</p>`}`;
}
function fillComments(key){const b=$("#cbox");if(!b||cm.cur!==key)return;b.innerHTML=commentInner(key,cm.by[key]);b.hidden=false}
function loadComments(key,attempt=0){
  cm.cur=key;if(cm.on===false)return;if(cm.by[key]){fillComments(key);return}
  fetch(CAPI[attempt%2]+"?ad="+encodeURIComponent(key),{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject(r.status))
    .then(j=>{cm.on=true;cm.by[key]=j.comments||[];fillComments(key)})
    .catch(why=>{if(why===404&&attempt>=1){cm.on=false;return}if(attempt<3)setTimeout(()=>loadComments(key,attempt+1),600*(attempt+1))});
}
document.addEventListener("input",e=>{const f=e.target.closest&&e.target.closest(".cform");if(!f)return;if(e.target.name==="text")cm.draft[f.dataset.ad]=e.target.value;if(e.target.name==="name")store.set("commentName",e.target.value)});
document.addEventListener("submit",e=>{
  const f=e.target.closest(".cform");if(!f)return;e.preventDefault();
  const key=f.dataset.ad,stat=f.querySelector(".cstat"),btn=f.querySelector(".btn"),name=f.elements.name.value.trim(),text=f.elements.text.value.trim();
  if(!name){stat.textContent="Add your name first.";return}if(!text){stat.textContent="Write a comment first.";return}
  btn.disabled=true;stat.textContent="Saving…";
  const send=u=>fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({ad:key,name,text})});
  send(CAPI[0]).catch(()=>send(CAPI[1])).then(r=>r.json().then(j=>r.ok?j:Promise.reject(j.error||"Couldn't save the comment.")))
    .then(j=>{cm.by[key]=j.comments||[];cm.draft[key]="";fillComments(key);const s=$("#cbox .cstat");if(s)s.textContent="Comment added."})
    .catch(err=>{btn.disabled=false;stat.textContent=typeof err==="string"?err:"Couldn't save the comment."});
});

/* ------------------------------------------------------------------ merges (shared on the server when it has storage, else this browser) */
function loadMerges(done){
  fetch("api/merges",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject(r.status)).then(j=>{merges=j.merges||[];mergeShared=true;done()})
    .catch(()=>{merges=store.get("merges",[]);mergeShared=false;done()});
}
function saveMerges(){
  store.set("merges",merges);
  fetch("api/merges",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({merges})}).then(r=>{mergeShared=r.ok}).catch(()=>{mergeShared=false});
}
function doMerge(kind){
  const set=kind==="ad"?selAd:selCr,ids=new Set();
  if(kind==="ad")set.forEach(id=>ids.add(id));else set.forEach(k=>FULL.byKey[k]&&FULL.byKey[k].ads.forEach(a=>ids.add(a.id)));
  const nm=($("#mergeName")&&$("#mergeName").value.trim())||"Merged creative";
  merges=merges.filter(g=>{if(g.ads.some(x=>ids.has(x))){g.ads.forEach(x=>ids.add(x));return false}return true});
  merges.push({id:"g"+Date.now().toString(36),name:nm,ads:[...ids]});
  selAd.clear();selCr.clear();saveMerges();rebuild();closeDrawer();render();
}

/* ------------------------------------------------------------------ events */
document.addEventListener("click",e=>{
  const t=e.target;
  const tab=t.closest("[data-tab]");if(tab){state.tab=tab.dataset.tab;store.set("tab",state.tab);closeDrawer();render();return}
  if(t.closest("[data-close]")){closeDrawer();return}
  const sel=t.closest("[data-sel]");if(sel){const [k,id]=sel.dataset.sel.split("|");const set=k==="ad"?selAd:selCr;sel.checked?set.add(id):set.delete(id);render();return}
  const mg=t.closest("[data-merge]");if(mg){doMerge(mg.dataset.merge);return}
  const cl=t.closest("[data-clear]");if(cl){(cl.dataset.clear==="ad"?selAd:selCr).clear();render();return}
  const um=t.closest("[data-unmerge]");if(um){merges=merges.filter(g=>g.id!==um.dataset.unmerge);saveMerges();rebuild();closeDrawer();render();return}
  const so=t.closest("[data-sort]");if(so){const [id,k]=so.dataset.sort.split("|"),st=sorts[id]||(sorts[id]={k,asc:false});if(st.k===k)st.asc=!st.asc;else{st.k=k;st.asc=(k==="lead"||(COLS[k]&&COLS[k].low))}render();return}
  const fm=t.closest("[data-fmt]");if(fm){state.fmt=fm.dataset.fmt;render();return}
  const ce=t.closest("[data-creator]");if(ce&&!t.closest("[data-open]")){const k=ce.dataset.creator;state.openCreators.has(k)?state.openCreators.delete(k):state.openCreators.add(k);render();return}
  const rt=t.closest("[data-ret]");if(rt){state.ret=rt.dataset.ret;store.set("ret",state.ret);render();return}
  const lv=t.closest("[data-level]");if(lv){state.level=lv.dataset.level;store.set("level",state.level);render();return}
  const sa=t.closest("[data-showall]");if(sa){const k=sa.dataset.showall;state.showAll[k]=!state.showAll[k];render();return}
  if(t.closest("[data-pvmore]")){state.pvN+=12;render();return}
  if(t.closest("[data-vreset]")){V={...VDEF0};store.set("vdef",V);rebuild();render();return}
  const op=t.closest("[data-open]");if(op&&!t.closest("input,a,button")){const [k,id]=op.dataset.open.split("|");openDrawer(k,id)}
});
document.addEventListener("change",e=>{
  const t=e.target;if(t.id==="smart"){SMART=t.checked;store.set("smart",SMART);selCr.clear();rebuild();render();return}
  if(t.id==="pfmt"&&t.closest("#drawer")){state.pvfmt=t.value;store.set("pvfmt",t.value);const b=$("#pbox");if(b&&state.open){const a=state.open.kind==="ad"?FULL.adById[state.open.id]:(FULL.byKey[state.open.id]||{}).rep;if(a&&!DATA.sample)loadPreview(b,a.id,t.value)}return}
  const k=t.dataset&&t.dataset.v;if(!k)return;
  V[k]=t.type==="checkbox"?t.checked:(t.type==="number"&&k!=="custom"?Math.max(0,parseFloat(t.value)||0):t.value);
  store.set("vdef",V);rebuild();render();
});
$("#theme").addEventListener("click",()=>{const d=document.documentElement,cur=d.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");d.dataset.theme=cur==="dark"?"light":"dark";store.set("theme",d.dataset.theme)});
{const th=store.get("theme",null);if(th)document.documentElement.dataset.theme=th}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&state.open)closeDrawer()});

/* ------------------------------------------------------------------ boot */
const TABS=[["creatives","Creatives"],["ads","Ads"],["previews","Ad previews"],["creators","Creators"],["hooks","Primary text hooks"],["bf","Black Friday"],["campaigns","Campaigns & ad sets"]];
function render(){
  const acc=DATA.account||{};
  $("#meta").innerHTML=[DATA.sample?'<span class="badge-sample">SAMPLE DATA, not real results</span>':"",`<span>Account <b>${esc(acc.name||acc.id||"")}</b></span>`,`<span>Range <b>${esc(DATA.dateRange)}</b></span>`,
    `<span>${ads.length} ads → ${FULL.creatives.length} creatives</span>`,`<span>Pulled ${esc(DATA.pulledAt.replace("T"," ").slice(0,16))}</span>`].filter(Boolean).join("");
  $("#tabs").innerHTML=TABS.map(([k,l])=>`<button class="tab ${k==="bf"?"bf":""}" role="tab" data-tab="${k}" aria-selected="${state.tab===k}">${l}</button>`).join("");
  ({creatives:renderCreatives,ads:renderAds,previews:renderPreviews,creators:renderCreators,hooks:renderHooks,bf:renderBF,campaigns:renderCampaigns}[state.tab]||renderCreatives)();
}
if(!ads.length)$("#main").innerHTML=`<div class="card empty">No ads were returned for this account in the selected range.</div>`;
else loadMerges(()=>{rebuild();render();const m=location.hash.match(/^#(cr|ad)-(.+)$/);if(m)openDrawer(m[1],decodeURIComponent(m[2]))});
</script>
